name: Upload Release Asset

# Based on example from https://github.com/actions/upload-release-asset
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '2*' # Push events to matching 2*, i.e. 2011.11, 2024.1.0

permissions:
  contents: write

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    # Build inside AlmaLinux 8 to match the target HPC image (Python 3.6.x)
    container:
      image: almalinux:8
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y python3 python3-pip git tar gzip
          python3 -m pip install --upgrade "pip<21.0" "setuptools<51.0" "virtualenv<20.16"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build pkg
        run: |
          python3 -m virtualenv "$GITHUB_WORKSPACE/.venv"
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          python package.py

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Get SGE binaries
        run: |
          curl -fL -o dist/sge-2011.11-64.tgz \
            https://github.com/Azure/cyclecloud-gridengine/releases/download/1.0.0/sge-2011.11-64.tgz
          curl -fL -o dist/sge-2011.11-common.tgz \
            https://github.com/Azure/cyclecloud-gridengine/releases/download/1.0.0/sge-2011.11-common.tgz

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          token: ${{ secrets.ACTION_PAT }}
          files: |
            dist/cyclecloud-gridengine-pkg-${{ steps.get_version.outputs.VERSION }}.tar.gz
            dist/sge-2011.11-64.tgz
            dist/sge-2011.11-common.tgz